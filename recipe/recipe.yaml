context:
  version: "14.1.0"

package:
  name: winreg
  version: ${{ version }}

source:
  url: https://github.com/GiovanniDicanio/WinReg/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e97561bfa90da7e397d8cd50b95ff3d1d07b3397b92f6e77ad6627242408b002

build:
  number: 0
  skip: not win
  script: xcopy "Include\WinReg" "%LIBRARY_PREFIX%\include\WinReg" /E /I /Y

tests:
  - package_contents:
      include:
        - WinReg/WinReg.hpp
        - WinReg/RegException.hpp
        - WinReg/RegExpected.hpp
        - WinReg/RegKey.hpp
        - WinReg/RegKey_impl.hpp
        - WinReg/RegResult.hpp
        - WinReg/detail/Config.hpp
        - WinReg/detail/ExpandStrings.hpp
        - WinReg/detail/MultiString.hpp
        - WinReg/detail/SafeCast.hpp
        - WinReg/detail/ScopedLocalFree.hpp

about:
  homepage: https://github.com/GiovanniDicanio/WinReg
  license: MIT
  license_file: LICENSE
  summary: Convenient high-level C++ wrapper around the Windows Registry API

extra:
  recipe-maintainers:
    - wolfv
