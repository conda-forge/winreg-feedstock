context:
  version: "14.0.0"

package:
  name: winreg
  version: ${{ version }}

source:
  url: https://github.com/GiovanniDicanio/WinReg/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ca746390f5755be5b4f9b3ef06a97e6ef7328a7f1f413063ae14306bd6c11a0d

build:
  number: 0
  skip: not win
  script: xcopy "WinReg\Include\WinReg" "%LIBRARY_PREFIX%\include\WinReg" /E /I /Y

tests:
  - package_contents:
      include:
        - WinReg/WinReg.hpp
        - WinReg/RegException.hpp
        - WinReg/RegExpected.hpp
        - WinReg/RegKey.hpp
        - WinReg/RegResult.hpp
        - WinReg/internal/MultiString.hpp
        - WinReg/internal/SafeCast.hpp
        - WinReg/internal/ScopedLocalFree.hpp

about:
  homepage: https://github.com/GiovanniDicanio/WinReg
  license: MIT
  license_file: LICENSE
  summary: Convenient high-level C++ wrapper around the Windows Registry API

extra:
  recipe-maintainers:
    - wolfv
